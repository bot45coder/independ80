<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Independence Day 🇮🇳</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(180deg,#ff9933 0%,#ffffff 50%,#138808 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Floating particles */

.particle{
    position:absolute;
    border-radius:50%;
    animation:float linear infinite;
    opacity:.7;
}

@keyframes float{
from{
    transform:translateY(110vh);
}
to{
    transform:translateY(-120vh);
}
}

/* Card */

.card{
    width:min(92%,500px);
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    z-index:10;
}

h1{
    color:#062f63;
    font-size:clamp(28px,6vw,48px);
}

h2{
    margin-top:8px;
    color:#444;
    font-weight:500;
    min-height:32px;
    font-size:clamp(16px,4vw,22px);
}

/* FLAG */

.flag{
    width:280px;
    max-width:90%;
    height:170px;
    margin:30px auto;
    overflow:hidden;
    border-radius:6px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    animation:wave 3s ease-in-out infinite;
}

.saffron,
.white,
.green{
    height:33.333%;
}

.saffron{
    background:#FF9933;
}

.white{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
}

.green{
    background:#138808;
}

@keyframes wave{
0%,100%{
transform:rotateY(0deg);
}
50%{
transform:rotateY(14deg);
}
}

/* Ashoka Chakra */

.chakra{
    width:58px;
    height:58px;
    border:2.8px solid #000080;
    border-radius:50%;
    position:relative;
    animation:spin 18s linear infinite;
}

.spoke{
    position:absolute;
    width:2px;
    height:29px;
    background:#000080;
    left:50%;
    top:50%;
    transform-origin:bottom center;
}

.center{
    width:8px;
    height:8px;
    background:#000080;
    border-radius:50%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

/* Button */

button{
    margin-top:15px;
    padding:14px 28px;
    border:none;
    border-radius:40px;
    background:#062f63;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.footer{
    margin-top:18px;
    color:#333;
    line-height:1.6;
    font-size:15px;
}

/* Canvas */

canvas{
    position:absolute;
    inset:0;
    pointer-events:none;
}

@media(max-width:480px){

.card{
padding:18px;
}

.flag{
height:150px;
}

button{
width:100%;
}

}
</style>

</head>
<body>

<canvas id="canvas"></canvas>

<div class="card">

<h1>🇮🇳 Happy Independence Day 🇮🇳</h1>

<h2 id="typing"></h2>

<div class="flag">

<div class="saffron"></div>

<div class="white">

<div class="chakra" id="chakra"></div>

</div>

<div class="green"></div>

</div>

<button onclick="celebrate()">
🎆 Celebrate India
</button>

<div class="footer">

Freedom • Unity • Diversity ❤️<br>
Let's Build a Stronger India Together 🇮🇳

</div>

</div>

<script>

/* 24 SPOKES */

const chakra=document.getElementById("chakra");

for(let i=0;i<24;i++){

let spoke=document.createElement("div");

spoke.className="spoke";

spoke.style.transform=`translate(-50%,-100%) rotate(${i*15}deg)`;

chakra.appendChild(spoke);

}

let center=document.createElement("div");
center.className="center";
chakra.appendChild(center);


/* Typing */

const msg="Proud to be an Indian. Happy Independence Day! 🇮🇳";

let i=0;

(function type(){

if(i<msg.length){

typing.innerHTML+=msg.charAt(i);

i++;

setTimeout(type,60);

}

})();


/* Floating Particles */

const colors=["#FF9933","#ffffff","#138808"];

for(let i=0;i<70;i++){

let p=document.createElement("div");

p.className="particle";

let s=Math.random()*8+4;

p.style.width=s+"px";

p.style.height=s+"px";

p.style.background=colors[Math.floor(Math.random()*3)];

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(Math.random()*7+5)+"s";

document.body.appendChild(p);

}


/* FIREWORK */

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=innerWidth;
canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);

let fireworks=[];

function createFirework(x,y){

let arr=[];

for(let i=0;i<80;i++){

arr.push({

x,y,

dx:(Math.random()-0.5)*8,

dy:(Math.random()-0.5)*8,

life:100,

color:`hsl(${Math.random()*360},100%,60%)`

});

}

fireworks.push(arr);

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

fireworks.forEach((fw,index)=>{

fw.forEach(p=>{

ctx.fillStyle=p.color;

ctx.beginPath();

ctx.arc(p.x,p.y,2.5,0,Math.PI*2);

ctx.fill();

p.x+=p.dx;

p.y+=p.dy;

p.dy+=0.04;

p.life--;

});

fireworks[index]=fw.filter(p=>p.life>0);

});

fireworks=fireworks.filter(f=>f.length);

requestAnimationFrame(animate);

}

animate();

document.addEventListener("click",e=>{

createFirework(e.clientX,e.clientY);

});

function celebrate(){

for(let i=0;i<5;i++){

setTimeout(()=>{

createFirework(
Math.random()*innerWidth,
Math.random()*innerHeight*0.6
);

},i*250);

}

navigator.vibrate?.([100,80,100]);

playTune();

}


/* Simple Tune */

function playTune(){

const ac=new(window.AudioContext||window.webkitAudioContext)();

const notes=[262,330,392,523,392,330,262];

notes.forEach((n,index)=>{

let osc=ac.createOscillator();

let gain=ac.createGain();

osc.frequency.value=n;

osc.type="triangle";

osc.connect(gain);

gain.connect(ac.destination);

gain.gain.value=0.05;

osc.start(ac.currentTime+index*.2);

osc.stop(ac.currentTime+index*.2+.18);

});

}

</script>

</body>
</html>
