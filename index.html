<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>India From Particles | Independence Day</title>

    <meta name="theme-color" content="#0b1220">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Glow Layer -->
    <canvas id="glowCanvas"></canvas>

    <!-- Hero -->
    <section class="hero">

        <div class="badge">
            🇮🇳 79th Independence Day
        </div>

        <h1>
            INDIA
        </h1>

        <p id="subtitle">
            Every particle has a story...
        </p>

        <button id="startBtn">
            Begin Journey
        </button>

    </section>

    <!-- Scroll Hint -->
    <div class="scrollHint">
        Move Mouse • Touch Screen
    </div>

    <!-- Loading -->
    <div id="loading">

        <div class="loader"></div>

        <span>
            Initializing Particle Engine...
        </span>

    </div>

    <!-- Stage Indicator -->

    <div class="stage">

        <span id="stageText">
            Stage 1 / 4
        </span>

    </div>

    <!-- FPS Counter (Development) -->

    <div id="fps">
        FPS: 0
    </div>

    <!-- Overlay -->

    <div id="overlay"></div>

    <!-- Audio -->

    <audio id="bgMusic" preload="auto"></audio>

    <!-- Hidden Images (used later for particle morphing) -->

    <img
        id="indiaShape"
        src="assets/india.png"
        alt=""
        hidden>

    <img
        id="flagShape"
        src="assets/flag.png"
        alt=""
        hidden>

    <img
        id="textShape"
        src="assets/text.png"
        alt=""
        hidden>

    <!-- Future UI -->

    <div id="controls">

        <button id="resetBtn">
            Reset
        </button>

        <button id="fireworkBtn">
            Fireworks
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
