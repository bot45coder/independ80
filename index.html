<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>India From Particles | Independence Day</title>
    <meta name="description" content="An award-winning interactive particle experience celebrating India's Independence Day.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Premium Animated Background Layer -->
    <div class="background-canvas-container">
        <canvas id="bgCanvas"></canvas>
    </div>

    <!-- Main Particle Engine Layer -->
    <canvas id="mainCanvas"></canvas>

    <!-- Glassmorphism UI Overlay -->
    <div id="ui-container" class="glass-panel">
        <h1 class="gradient-text">Every Particle Has A Story</h1>
        <p class="subtitle">A tribute to the spirit of India</p>
        <button id="start-btn" class="glow-button">
            <span>Begin Journey</span>
        </button>
    </div>

    <!-- Celebration Message (Hidden initially) -->
    <div id="celebration-ui" class="hidden">
        <h2 class="celebration-text">JAI HIND</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
